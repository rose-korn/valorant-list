# เว็บเป็น static: ข้อมูลจาก valorant-api จะอัปเดตก็ต่อเมื่อ build ใหม่ ไฟล์นี้ build แล้ว deploy ขึ้น Cloudflare ทุกวัน
# ต้องตั้ง repository secret 2 ตัว: CLOUDFLARE_API_TOKEN (สิทธิ์ "Edit Cloudflare Workers") และ CLOUDFLARE_ACCOUNT_ID
# ถ้ายังไม่ตั้ง จะข้ามไปเฉย ๆ (เว็บยังอัปเดตตามปกติทุกครั้งที่ push เข้า main)
name: Daily rebuild

on:
  schedule:
    - cron: '17 21 * * *' # ทุกวัน 04:17 เวลาไทย (หลัง patch ใหม่มักออกตอนกลางคืน)
  workflow_dispatch:

jobs:
  rebuild:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - name: Check secrets
        id: check
        working-directory: .
        run: |
          if [ -z "$CLOUDFLARE_API_TOKEN" ] || [ -z "$CLOUDFLARE_ACCOUNT_ID" ]; then
            echo "Cloudflare secrets are not set, skipping"
            echo "skip=true" >> "$GITHUB_OUTPUT"
          fi
      - uses: actions/checkout@v4
        if: steps.check.outputs.skip != 'true'
      - uses: actions/setup-node@v4
        if: steps.check.outputs.skip != 'true'
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - if: steps.check.outputs.skip != 'true'
        run: npm ci && npm run build
      - if: steps.check.outputs.skip != 'true'
        run: npx wrangler deploy
