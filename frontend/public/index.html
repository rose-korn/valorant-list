<!doctype html>
<html lang="th">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Valorant List</title>
<!-- หน้าแรกจริงอยู่ที่ /th กับ /en: เด้งไปภาษาที่เคยเลือกไว้ (ไม่เคยเลือก = ไทย) — สคริปต์ชุดเดียวกับ lib/lang-redirect.ts -->
<script>(function(){var p=location.pathname;if(/^\/(th|en)(\/|$)/.test(p))return;var l;try{l=localStorage.getItem('valolist:lang')}catch(e){}if(l!=='en')l='th';location.replace('/'+l+(p==='/'?'':p.replace(/\/index\.html$/,''))+location.search+location.hash)})()</script>
<noscript><meta http-equiv="refresh" content="0; url=/th"></noscript>
<link rel="alternate" hreflang="th" href="/th">
<link rel="alternate" hreflang="en" href="/en">
</head>
<body style="font-family:sans-serif;background:#f4efe6;color:#1d1f24;text-align:center;padding:4rem 1rem">
<p><a href="/th">ภาษาไทย</a> · <a href="/en">English</a></p>
</body>
</html>
